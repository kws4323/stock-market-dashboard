<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Pulse | 주식 대시보드</title><style>body{margin:0;background:#0b1220;color:#e9f0fa;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px 18px}h1{font-size:30px}small,.muted{color:#9db0ca}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#172337;border:1px solid #293b54;border-radius:16px;padding:20px}strong{font-size:25px}button{background:#263e5d;color:white;border:0;border-radius:8px;padding:8px;cursor:pointer}.up{color:#54d5a2}.down{color:#ff8593}canvas{width:100%;height:170px}a{color:#95c8ff}</style></head><body><main><h1>Market Pulse <small>주식 대시보드</small></h1><p id="status" class="muted">데이터를 불러오는 중...</p><h2>주요 지수 · 환율 · 원자재</h2><div id="markets" class="grid"></div><h2>최근 종가 추이</h2><div class="card"><h3 id="chart-title">항목을 선택하세요</h3><canvas id="chart" width="850" height="170"></canvas></div><h2>기관 13F · 정치인 거래 공시</h2><div class="grid"><div class="card"><h3>기관 13F</h3><p>SEC 13F는 분기별 보유 현황이며 실시간 매매 신호가 아닙니다.</p><a href="https://www.sec.gov/edgar/search/" target="_blank" rel="noopener">SEC EDGAR 원문 조회 ↗</a></div><div class="card"><h3>미국 정치인 거래</h3><p>의회 PTR은 별도 공시이며 13F와 다릅니다. 신고 시차가 있습니다.</p><a href="https://disclosures-clerk.house.gov/FinancialDisclosure" target="_blank" rel="noopener">하원 공식 공시 조회 ↗</a></div></div><p class="muted">데이터는 참고용이며 지연·누락될 수 있습니다. 재배포 조건 확인 후 추가 데이터원을 연결합니다.</p></main><script>let all=[];const fmt=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2});function plot(m){document.getElementById('chart-title').textContent=m.name+' · 최근 거래일 종가';const c=document.getElementById('chart'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);let p=m.history||[];if(p.length<2){x.fillStyle='#9db0ca';x.fillText('표시할 시계열이 없습니다',20,80);return}let v=p.map(z=>z.close),lo=Math.min(...v),hi=Math.max(...v),span=hi-lo||1;x.strokeStyle='#54d5a2';x.lineWidth=3;x.beginPath();p.forEach((z,i)=>{let xx=30+i*(c.width-60)/(p.length-1),yy=145-(z.close-lo)/span*115;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.fillStyle='#9db0ca';x.fillText(p[0].date,20,165);x.fillText(p[p.length-1].date,c.width-100,165)}fetch('./data/markets.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('데이터 파일 없음');return r.json()}).then(d=>{all=d.markets||[];document.getElementById('status').textContent='최근 수집: '+(d.updated_at||'미수집')+' · 종가 기준 / 제공처 지연 가능';let root=document.getElementById('markets');all.forEach(m=>{let div=document.createElement('div');div.className='card';let change=m.change_pct;div.innerHTML='<small></small><p><strong></strong></p><p class="muted"></p>';div.querySelector('small').textContent=m.name;div.querySelector('strong').textContent=m.close==null?'데이터 없음':fmt(m.close);let p=div.querySelector('p.muted');p.textContent=change==null?'등락률 없음':(change>0?'+':'')+fmt(change)+'%';p.className=change>0?'up':change<0?'down':'muted';let b=document.createElement('button');b.textContent='차트 보기';b.onclick=()=>plot(m);div.append(b);root.append(div)});if(all.length)plot(all[0])}).catch(e=>document.getElementById('status').textContent='데이터 준비 중: '+e.message);</script></body></html>
