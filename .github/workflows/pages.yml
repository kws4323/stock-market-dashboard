name: Update market dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * 1-5'
permissions:
  contents: read
concurrency:
  group: market-dashboard-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data client
        run: python -m pip install -r requirements.txt
      - name: Collect market snapshot
        run: |
          python scripts/test_collect.py
          python scripts/collect.py
      - name: Validate investor flow calculations
        run: python scripts/test_flows.py
      - name: Collect Korean investor flows
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/flows.py
      - name: Collect institutional disclosures
        run: |
          python scripts/test_institutions.py
          python scripts/institutions.py
          node scripts/test_portfolio.cjs
          node scripts/test_portfolio_ui.cjs
          python scripts/portfolio_metadata.py
      - name: Preserve daily investor history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/flows.json data/institutions.json data/portfolio-metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update investor history [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
