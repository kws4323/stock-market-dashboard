name: Update market dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'
      timezone: 'Asia/Seoul'
    - cron: '40 11 * * *'
      timezone: 'Asia/Seoul'
    - cron: '0 18 * * *'
      timezone: 'Asia/Seoul'
permissions:
  contents: write
concurrency:
  group: market-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/cache@v4
        with:
          path: |
            work/ptr-cache
            work/sec-cache
          key: free-sources-v2-${{ github.run_id }}
          restore-keys: free-sources-v2-
      - name: Collect research snapshots
        run: python scripts/research.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FMP_PUBLIC_REDISTRIBUTION: ${{ vars.FMP_PUBLIC_REDISTRIBUTION }}
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json data/research.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh market snapshot"
            git push
          fi
